<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shorya. — Admin Dashboard</title>
  
  <!-- Same font and icons as main site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  
  <!-- Use main styles for consistency, plus admin specific styles -->
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: var(--bg-base);
      padding: 40px 24px;
      color: var(--text-primary);
    }
    .admin-container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    
    /* Login Section */
    #login-section {
      max-width: 400px;
      margin: 100px auto;
      background: rgba(255,255,255,0.03);
      padding: 40px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
    }
    #login-section h2 { margin-bottom: 24px; }
    #login-section p { color: var(--text-secondary); margin-bottom: 24px; font-size: 0.9rem; line-height: 1.5; }
    
    /* Dashboard Section */
    #dashboard-section { display: none; }
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .admin-project-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
    }
    .admin-project-card:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.2);
    }
    .apc-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .apc-thumb {
      width: 88px;
      height: 52px;
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .apc-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .apc-title { font-weight: 600; font-size: 1.05rem; color: #ffffff; }
    .apc-cat-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--violet-light);
      background: var(--violet-dim);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      width: fit-content;
    }
    .apc-skills-text {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.5;
    }
    .apc-actions {
      display: flex;
      gap: 12px;
    }
    .btn-sm {
      padding: 8px 16px;
      font-size: 0.85rem;
    }
    
    /* Admin Filter Tabs */
    .admin-filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.03);
      padding: 6px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }
    .admin-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.8125rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
    }
    .admin-tab-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }
    .admin-tab-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    
    /* Editor Section */
    #editor-section { display: none; }
    .editor-form {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px;
    }
    .links-container {
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
    }
    .link-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      align-items: flex-end;
    }
    .link-row .form-group { margin-bottom: 0; flex: 1; }
    .link-row .form-group.checkbox { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    
    /* Top Loader */
    #loader {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 3px;
      background: var(--violet);
      animation: loadingBar 1s infinite;
      z-index: 1000;
    }
    @keyframes loadingBar {
      0% { width: 0%; margin-left: 0; }
      50% { width: 100%; margin-left: 0; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div id="loader"></div>
  
  <div class="admin-container">
    <div class="admin-header">
      <a href="index.html" class="nav-logo">Shorya. <span style="font-family: var(--font-sans); font-size: 0.9rem; font-style: normal; color: var(--text-secondary); margin-left: 12px;">Admin</span></a>
      <div id="user-controls" style="display: none;">
        <button id="logoutBtn" class="contact-link" style="padding: 4px 12px; margin: 0; background: none; border: 1px solid var(--border);">Logout</button>
      </div>
    </div>

    <!-- 1. LOGIN -->
    <div id="login-section">
      <h2>Admin Login</h2>
      <p>Please enter your GitHub Personal Access Token. This dashboard communicates directly with the GitHub API to update your portfolio JSON file securely.</p>
      <div class="form-group">
        <label class="form-label" for="ghToken">GitHub Token (classic or fine-grained)</label>
        <input type="password" id="ghToken" class="form-input" placeholder="ghp_..." />
      </div>
      <button id="loginBtn" class="btn btn-primary" style="width: 100%;">Connect to GitHub</button>
      <p id="loginError" style="color: #ff6b6b; margin-top: 16px; display: none;"></p>
    </div>

    <!-- 2. DASHBOARD -->
    <div id="dashboard-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2>Your Portfolio</h2>
        <button id="addNewBtn" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Add New Project</button>
      </div>

      <!-- Admin Filter Tabs -->
      <div class="admin-filter-tabs" id="adminFilterTabs">
        <button class="admin-tab-btn active" data-filter="all">All</button>
        <button class="admin-tab-btn" data-filter="saas">SaaS &amp; AI</button>
        <button class="admin-tab-btn" data-filter="interior">Interior &amp; Decor</button>
        <button class="admin-tab-btn" data-filter="fashion">Fashion &amp; Luxury</button>
        <button class="admin-tab-btn" data-filter="beauty">Wellness &amp; Beauty</button>
        <button class="admin-tab-btn" data-filter="education">Education &amp; EdTech</button>
        <button class="admin-tab-btn" data-filter="b2b">B2B &amp; Enterprise</button>
        <button class="admin-tab-btn" data-filter="impact">Health &amp; Impact</button>
        <button class="admin-tab-btn" data-filter="branding">Branding &amp; Media</button>
      </div>

      <div class="project-list" id="projectList">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- 3. EDITOR -->
    <div id="editor-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 id="editorTitle">Add Project</h2>
        <button id="cancelEditBtn" class="contact-link" style="padding: 4px 12px; margin: 0; background: none;">Cancel</button>
      </div>
      
      <div class="editor-form">
        <input type="hidden" id="editId" />
        
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Project Name</label>
            <input type="text" id="editName" class="form-input" required />
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="editCategory" class="form-select" required>
              <option value="saas">SaaS &amp; AI</option>
              <option value="interior">Interior &amp; Decor</option>
              <option value="fashion">Fashion &amp; Luxury</option>
              <option value="beauty">Wellness &amp; Beauty</option>
              <option value="education">Education &amp; EdTech</option>
              <option value="b2b">B2B &amp; Enterprise</option>
              <option value="impact">Health &amp; Social Impact</option>
              <option value="branding">Branding &amp; Media</option>
            </select>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group" style="flex: 2;">
            <label class="form-label">Image URL (e.g. assets/my-image.jpg or https://...)</label>
            <input type="text" id="editImageUrl" class="form-input" placeholder="Leave empty to use placeholder text" />
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label">Or Upload Image</label>
            <input type="file" id="editImageUpload" class="form-input" accept="image/*" style="padding: 10px; cursor: pointer;" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Image Placeholder Text (Fallback)</label>
            <input type="text" id="editImage" class="form-input" required />
          </div>
        </div>
        

        

        
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="editDesc" class="form-input" rows="4" required></textarea>
        </div>

        <!-- Skills Selector -->
        <label class="form-label" style="margin-top: 16px;">Technologies &amp; Skills Used</label>
        <div class="skills-admin-section">
          <div class="skills-category-block">
            <div class="skills-cat-title">Design</div>
            <div class="skills-pills-flex">
              <label class="skill-toggle-pill"><input type="checkbox" value="Figma" class="skill-pill-input"><span>Figma</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Adobe Photoshop" class="skill-pill-input"><span>Adobe Photoshop</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Generative AI" class="skill-pill-input"><span>Generative AI</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="UI/UX Design" class="skill-pill-input"><span>UI/UX Design</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Design Systems" class="skill-pill-input"><span>Design Systems</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Usability Testing" class="skill-pill-input"><span>Usability Testing</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="UX Research" class="skill-pill-input"><span>UX Research</span></label>
            </div>
          </div>

          <div class="skills-category-block">
            <div class="skills-cat-title">Development</div>
            <div class="skills-pills-flex">
              <label class="skill-toggle-pill"><input type="checkbox" value="WordPress" class="skill-pill-input"><span>WordPress</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Elementor Pro" class="skill-pill-input"><span>Elementor Pro</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Webflow" class="skill-pill-input"><span>Webflow</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Framer" class="skill-pill-input"><span>Framer</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Shopify Plus" class="skill-pill-input"><span>Shopify Plus</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Shopify Apps" class="skill-pill-input"><span>Shopify Apps</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="React / Next.js" class="skill-pill-input"><span>React / Next.js</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Cursor AI" class="skill-pill-input"><span>Cursor AI</span></label>
            </div>
          </div>

          <div class="skills-category-block">
            <div class="skills-cat-title">Marketing</div>
            <div class="skills-pills-flex">
              <label class="skill-toggle-pill"><input type="checkbox" value="Programmatic SEO" class="skill-pill-input"><span>Programmatic SEO</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="SEO/SEM" class="skill-pill-input"><span>SEO/SEM</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="CRO Strategy" class="skill-pill-input"><span>CRO Strategy</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="A/B Testing" class="skill-pill-input"><span>A/B Testing</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Marketing Ops" class="skill-pill-input"><span>Marketing Ops</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Conversion Funnels" class="skill-pill-input"><span>Conversion Funnels</span></label>
              <label class="skill-toggle-pill"><input type="checkbox" value="Analytics" class="skill-pill-input"><span>Analytics</span></label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Detailed Case Study Write-Up (HTML Supported)</label>
          <textarea id="editDetailedContent" class="form-input" rows="8" placeholder="<p>Detailed explanation of what was done, architecture, results...</p>"></textarea>
        </div>
        
        <label class="form-label">External Links</label>
        <div class="links-container" id="linksContainer">
          <!-- Dynamically added -->
        </div>
        <button id="addLinkBtn" class="btn btn-outline btn-sm" style="margin-bottom: 32px;"><i class="fa-solid fa-plus"></i> Add Link</button>
        
        <div style="border-top: 1px solid var(--border); padding-top: 24px; display: flex; justify-content: flex-end; gap: 16px;">
          <button id="saveBtn" class="btn btn-primary">Save to GitHub</button>
        </div>
      </div>
    </div>
    
  </div>

  <script src="admin.js"></script>
</body>
</html>
